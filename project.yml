name: JET
options:
  bundleIdPrefix: com.kanha
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CLANG_ENABLE_MODULES: YES
    ALWAYS_SEARCH_USER_PATHS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ENABLE_MODULE_VERIFIER: NO

targets:
  JET:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: JET
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kanha.jet
        PRODUCT_NAME: JET
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: JET/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        SWIFT_EMIT_LOC_STRINGS: NO
        DEVELOPMENT_ASSET_PATHS: ""
    info:
      path: JET/Resources/Info.plist
      properties:
        CFBundleDisplayName: JET
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UIUserInterfaceStyle: Dark
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - armv7
        NSBluetoothAlwaysUsageDescription: JET connects to your scooter over Bluetooth to unlock it and end your ride.
        NSBluetoothPeripheralUsageDescription: JET connects to your scooter over Bluetooth to unlock it.
        NSCameraUsageDescription: JET uses the camera to scan the QR code on the scooter.
        NFCReaderUsageDescription: JET reads contactless cards and tags so you can inspect what a vehicle or transit card is presenting.
        NSLocationWhenInUseUsageDescription: JET shows scooters near you and tracks your ride distance.
        NSLocationAlwaysAndWhenInUseUsageDescription: JET keeps your ride tracking accurate while the screen is off.
        ITSAppUsesNonExemptEncryption: false
